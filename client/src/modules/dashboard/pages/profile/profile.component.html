<div class="profile-page">
    <mat-toolbar class="title-bar">
        <button mat-button routerLink="/dashboard"> 
            <h1 [style]="{'color' : 'white', 'font-weight': '600'}">Portfolio Builder</h1>
        </button>
        <!-- Legacy section navigation removed: stepper handles flow -->
        <div class="profile-icon" (click)="openProfileForm()">
            <img [src]="user?.profilePicture" alt="Profile Icon" />
            <button mat-raised-button (click)="logout()" class="logout-button">
                <span>
                    Logout
                </span>
                <mat-icon>logout</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div class="content">
        <app-stepper [alignment]="'vertical'" [steps]="applicationSteps"></app-stepper>
    </div>
</div>
