<div class="profile-page">
    <!-- Scrollable Container -->
    <div class="profile-scroll-container">
        <header class="modern-header">
        <div class="header-content">
            <div class="header-left">
                <button mat-button (click)="goToDashboard()" class="back-button">
                    <mat-icon>arrow_back</mat-icon>
                    <span>Back to Dashboard</span>
                </button>
            </div>
            <div class="header-center">
                <app-logo size="medium" variant="primary" [showText]="true" tagline="Grow your professional identity"></app-logo>
            </div>
            <div class="header-right">
                <div class="user-profile" (click)="openProfileForm()">
                    <div class="user-avatar">
                        <img [src]="user?.profilePicture || '/assets/default-avatar.png'" alt="Profile" />
                    </div>
                    <div class="user-info">
                        <span class="user-name">{{ user?.name || 'User' }}</span>
                        <span class="user-email">{{ user?.email || 'user@example.com' }}</span>
                    </div>
                </div>
                <button mat-icon-button (click)="logout()" class="logout-btn" matTooltip="Logout">
                    <mat-icon>logout</mat-icon>
                </button>
            </div>
        </div>
    </header>
    <div class="content">
        <app-stepper [alignment]="'vertical'" [steps]="applicationSteps"></app-stepper>
    </div>
    </div> <!-- End scrollable container -->

    <!-- Chat Button -->
    <app-chat-button></app-chat-button>
    
    <!-- Chat Assistant -->
    <app-chat></app-chat>
</div>
