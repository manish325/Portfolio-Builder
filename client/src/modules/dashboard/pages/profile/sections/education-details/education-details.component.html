<div class="education-details-container">
  <div class="form-header">
    <h3>Educational Details</h3>
    <p>Add your educational background and qualifications</p>
  </div>

  <form [formGroup]="parentFormGroup">
    <div formArrayName="educationDetails" class="education-list">
      <div *ngFor="let control of educationDetailsFormGroup.controls; let i = index" 
           [formGroupName]="i" 
           class="education-item">
        
        <div class="education-header">
          <h4>Education {{i + 1}}</h4>
          <button mat-icon-button 
                  color="warn" 
                  (click)="deleteEducation(i)"
                  [disabled]="educationDetailsFormGroup.length === 1"
                  class="delete-btn">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

        <div class="education-fields">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>School/University</mat-label>
            <input type="text" matInput formControlName="school" placeholder="e.g., MIT, Stanford University">
            <mat-icon matSuffix>school</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Degree</mat-label>
            <input type="text" matInput formControlName="degree" placeholder="e.g., Bachelor of Science">
            <mat-icon matSuffix>workspace_premium</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Field of Study</mat-label>
            <input type="text" matInput formControlName="fieldOfStudy" placeholder="e.g., Computer Science">
            <mat-icon matSuffix>menu_book</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Location</mat-label>
            <input type="text" matInput formControlName="location" placeholder="e.g., Cambridge, MA">
            <mat-icon matSuffix>location_on</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" 
                      placeholder="Describe your academic achievements, relevant coursework, or honors"
                      rows="3"></textarea>
            <mat-icon matSuffix>description</mat-icon>
          </mat-form-field>
        </div>
      </div>
    </div>
  </form>

  <div class="add-education-section">
    <button mat-raised-button 
            color="primary" 
            (click)="addEducation()"
            class="add-btn">
      <mat-icon>add</mat-icon>
      Add Education
    </button>
  </div>
</div>
